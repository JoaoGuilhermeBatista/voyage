spring:
  application:
    name: luvoy-api

  datasource:
    url: jdbc:postgresql://localhost:5433/luvoy
    username: luvoy_user
    password: luvoy
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:luvoy-dev-secret-key-2026-change-this-in-production}