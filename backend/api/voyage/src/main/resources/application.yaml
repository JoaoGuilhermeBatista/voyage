spring:
  application:
    name: luvoy-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: gpt-4o

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

supabase:
  url: ${SUPABASE_URL:not-configured}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:not-configured}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:not-configured}

exchange-rate:
  api-key: ${EXCHANGE_RATE_API_KEY:not-configured}
